navbar:
  links:
  - label: GitHub
    href: https://github.com/MervinPraison/PraisonAI-WPcli
footer:
  socials:
    github: https://github.com/MervinPraison
    x: https://x.com/MervinPraison
search:
  enabled: true
  provider: fusejs
content:
  docs:
    dir: mkdocs-docs
    include:
    - '**/*.md'
    - '**/*.mdx'
templates:
  docs:
    layout: ThreeColumnLayout
    slots:
      header:
        ref: header_main
      left:
        ref: sidebar_docs
      main:
        type: DocContent
      footer:
        ref: footer_main
components:
  header_main:
    type: Header
    props:
      logoText: PraisonAIWP
  footer_main:
    type: Footer
    props:
      text: Copyright © 2024 Mervin Praison
  sidebar_docs:
    type: DocsSidebar
    props:
      source: docs-nav
routes:
- match: /docs/**
  template: docs
