name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mkdocs-docs/**'
      - 'mkdocs.yml'
      - 'aiui.template.yaml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'mkdocs-docs/**'
      - 'mkdocs.yml'
      - 'aiui.template.yaml'
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PraisonAI UI
        run: pip install aiui

      - name: Build docs
        run: |
          aiui build --config aiui.template.yaml --output site --minify
          if [ -f CNAME ]; then cp CNAME site/CNAME; fi
          if [ -f docs/CNAME ]; then cp docs/CNAME site/CNAME; fi
          if [ -f mkdocs-docs/CNAME ]; then cp mkdocs-docs/CNAME site/CNAME; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
