name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'mkdocs-docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'mkdocs-docs/**'
      - 'mkdocs.yml'
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install 'mkdocs-material==9.8.0' 'mkdocstrings==1.0.8' 'mkdocstrings-python==2.0.10' 'pymdown-extensions==12.3'

      - name: Check out shared theme
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v4
        with:
          repository: MervinPraison/praisonai-docs-theme
          ssh-key: ${{ secrets.PRAISONAI_THEME_DEPLOY_KEY }}
          persist-credentials: false
          path: .praisonai-theme
      - name: Install shared theme
        if: github.event_name != 'pull_request'
        run: |
          pip install ./.praisonai-theme
          echo "PRAISONAI_THEME=praisonai" >> "$GITHUB_ENV"
      - name: Build MkDocs site
        run: |
          mkdocs build --config-file mkdocs.yml --site-dir site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
